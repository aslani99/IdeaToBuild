[package]
name = "ideatobuild"
version = "0.0.1"
description = "IdeaToBuild — secure personal knowledge, idea, and file management platform"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ideatobuild_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.bundle]
identifier = "com.aslani99.ideatobuild"
