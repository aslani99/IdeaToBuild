[package]
name = "ideatobuild"
version = "0.0.1"
description = "IdeaToBuild — secure personal knowledge, idea, and file management platform"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local-first encrypted storage (docs/DECISIONS.md AD-010): plain rusqlite
# (no SQLCipher/OpenSSL — keeps the Windows build simple) + AES-256-GCM
# field-level encryption of sensitive payloads, key held in the OS
# credential store via `keyring` (Windows Credential Manager / macOS
# Keychain / Linux Secret Service).
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
keyring = "2"
base64 = "0.22"

[lib]
name = "ideatobuild_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.bundle]
identifier = "com.aslani99.ideatobuild"
